version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/formsg_processor
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - SESSION_SECRET=your-session-secret-here
    depends_on:
      - db
    networks:
      - formsg-network

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=formsg_processor
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - formsg-network

networks:
  formsg-network:
    driver: bridge

volumes:
  postgres-data:
